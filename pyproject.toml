[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runninghub-cli"
version = "0.1.0"
description = "Command-line and agent-facing tools for RunningHub workflows and AI Apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RunningHub CLI" }
]
keywords = ["runninghub", "comfyui", "cli", "agent", "workflow"]
dependencies = [
    "runninghub-sdk>=1.1.5",
    "typer>=0.9.0",
]

[project.scripts]
runninghub = "runninghub_cli.main:app"
runhub = "runninghub_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["runninghub_cli*"]

